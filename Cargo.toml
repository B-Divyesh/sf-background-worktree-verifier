[package]
name = "worktree-verifier"
version = "0.1.0"
edition = "2021"
description = "Configured checks for separate Git worktrees"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-background-worktree-verifier"
exclude = ["site/**", ".factory/**", "dist/**", "graphify-out/**"]

[[bin]]
name = "worktree-verifier"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
